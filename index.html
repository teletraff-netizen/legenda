<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Легенда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12153a; --bg2:#0d1030; --card:#1f2456; --card2:#272d66; --line:#30377a;
  --text:#fff; --muted:#a6abd8; --dim:#6f75ad;
  --orange:#ec6a3f; --green:#2fb35f; --blue:#8fd3ff; --yellow:#ffd23f; --lav:#c8c9ef; --red:#ef5b5b; --mint:#7be0a4;
  --top:max(env(safe-area-inset-top),var(--tg-content-safe-area-inset-top,0px));
  --bottom:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,-apple-system,system-ui,sans-serif;font-weight:600}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:calc(var(--top) + 16px) 18px calc(var(--bottom) + 18px);animation:in .25s ease}
.screen.tabbed{padding-bottom:calc(var(--bottom) + 92px)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:28px;font-weight:800;margin:0;line-height:1.15}
h2{font-size:20px;font-weight:800;margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.card{background:var(--card);border-radius:18px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:18px;background:var(--orange);color:#14173d;font-weight:800;font-size:18px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--card);color:#fff}
.btn.navy{background:#14173d;color:#fff}
.btn[disabled]{opacity:.4}
.spacer{flex:1;min-height:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.gap{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);font-size:14px}

/* вход */
.login .logo{width:62%;margin:28px auto 26px;display:block}
.login .rings{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.login .rings i{position:absolute;border-radius:50%;border:2px solid #24306a}
label{display:block;color:var(--muted);font-size:15px;margin:16px 0 8px}
input{width:100%;height:58px;border-radius:16px;border:2px solid #2a3175;background:#1f2456;color:#fff;font:inherit;font-size:19px;font-weight:700;padding:0 18px;outline:none}
input:focus{border-color:var(--orange)}
.ok-line{color:var(--blue);font-size:14px;margin-top:8px;min-height:20px}
.err-line{color:var(--red)}

/* главная */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.top img{height:34px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:23px;font-weight:800}
.stat b span{font-size:14px;color:var(--muted)}
.daily{background:var(--orange);border-radius:22px;padding:18px;color:#14173d;position:relative;overflow:hidden}
.daily:after{content:"";position:absolute;right:-60px;top:-30px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(255,255,255,.12)}
.daily .over{font-size:12px;letter-spacing:.08em;font-weight:800;opacity:.75}
.daily h2{font-size:27px;margin:6px 0 4px;color:#14173d;position:relative;z-index:1}
.daily .tags{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.daily .tags span{background:rgba(20,23,61,.14);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800}
.daily .btn{position:relative;z-index:1}
.bar{height:7px;border-radius:9px;background:#30377a;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--yellow)}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;width:100%;text-align:left}
.task .dot{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.task .dot i{width:14px;height:14px;border-radius:50%}
.task b{display:block;font-size:16px}
.task small{color:var(--muted);font-size:13px}
.task .pts{margin-left:auto;font-weight:800;color:var(--blue)}

/* таббар */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid #1d2152;display:flex;justify-content:space-around;padding:10px 0 calc(var(--bottom) + 10px);z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);width:90px}
.tabbar button.on{color:var(--orange)}
.tabbar svg{width:26px;height:26px}

/* задание */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.close{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none}
.segs{flex:1;display:flex;gap:5px}
.segs i{flex:1;height:6px;border-radius:6px;background:#2c3372}
.segs i.done{background:var(--orange)} .segs i.now{background:#fff}
.count{font-weight:800;color:var(--muted);min-width:30px;text-align:right}
.rink{position:relative;border-radius:20px;overflow:hidden;background:#eef3f8}
.rink canvas{display:block;width:100%;height:auto}
.rink .badge{position:absolute;bottom:12px;left:12px;background:#14173d;color:#fff;font-size:13px;font-weight:800;padding:6px 11px;border-radius:999px}
.rink .stop{position:absolute;bottom:12px;right:12px;background:var(--orange);color:#14173d;font-size:13px;font-weight:800;padding:6px 11px;border-radius:999px}
.rink .cd{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:800;color:#14173d;background:rgba(238,243,248,.6)}
.q{font-size:23px;font-weight:800;margin:18px 0 4px;line-height:1.2}
.timer{height:5px;border-radius:5px;background:#2c3372;margin:14px 0;overflow:hidden}
.timer i{display:block;height:100%;background:var(--blue);width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.list{grid-template-columns:1fr}
.opt{min-height:74px;border-radius:18px;background:var(--card);border:2px solid #2a3175;font-size:30px;font-weight:800;padding:8px 14px;transition:transform .1s}
.opts.list .opt{min-height:60px;font-size:17px;text-align:left}
.opt:active{transform:scale(.97)}
.opt[disabled]{opacity:.45}
.opt.ok{background:var(--green);border-color:var(--green);opacity:1}
.opt.bad{border:2px dashed var(--muted);opacity:1}
.opt.pick{border-color:var(--orange)}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.explain{display:flex;gap:10px;background:var(--card);border-radius:16px;padding:14px;margin-top:14px;font-size:15px;line-height:1.4}
.explain svg{flex:none;color:var(--yellow)}

/* совмести */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .col small{color:var(--muted);font-size:13px;text-align:center}
.mbtn{min-height:62px;border-radius:16px;background:var(--card);border:2px solid #2a3175;font-size:17px;font-weight:800;padding:6px 8px;transition:transform .1s,background .2s}
.mbtn.sel{border-color:var(--orange);background:var(--card2)}
.mbtn.done{background:var(--green);border-color:var(--green)}
.mbtn.shake{animation:shake .35s;border-color:var(--red)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* результат раунда */
.result{text-align:center;padding-top:20px}
.halo{width:190px;height:190px;border-radius:50%;margin:10px auto 22px;display:grid;place-items:center;background:radial-gradient(circle,#1d2a4f 55%,transparent 56%),#191d4a}
.halo div{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}
.halo.ok div{background:var(--green)}
.halo.no div{background:#283070}
.result h1{font-size:38px}
.result p{color:#d6d9f5;font-size:17px;line-height:1.45;margin:10px 0 18px}
.lines{display:flex;flex-direction:column;gap:8px;text-align:left}
.line{display:flex;justify-content:space-between;background:var(--card);border-radius:14px;padding:15px 18px;font-size:16px}
.line b{color:#fff} .line .p{color:#fff;font-weight:800} .line .y{color:var(--yellow);font-weight:800} .line .b{color:var(--blue);font-weight:800}
.recap{background:var(--card);border-radius:16px;padding:14px;text-align:left}
.recap small{color:var(--muted);letter-spacing:.08em;font-size:12px}
.recap .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.recap .g div{background:var(--card2);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.recap .g b{display:block;font-size:24px;color:#fff}
.confetti{position:absolute;width:10px;height:6px;border-radius:2px;animation:fall 1.4s ease-out forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(60px) rotate(260deg);opacity:0}}

/* итог */
.ring{position:relative;width:190px;height:190px;margin:18px auto}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:46px;font-weight:800;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card small{color:var(--muted);font-size:14px}
.two .card b{display:block;font-size:34px;font-weight:800;margin-top:6px}
.newbadge{display:flex;gap:14px;align-items:center;border:2px solid var(--yellow);border-radius:18px;padding:14px;background:var(--card)}
.newbadge small{color:var(--yellow);letter-spacing:.08em;font-weight:800;font-size:12px}
.icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;color:#14173d}
.top3 .r{display:flex;padding:12px 14px;border-radius:12px;font-size:17px}
.top3 .r.me{background:var(--card2)} .top3 .r.me span:last-child{color:var(--orange)}
.top3 .r span:first-child{width:30px;color:var(--yellow);font-weight:800}
.top3 .r span:last-child{margin-left:auto;font-weight:800}

/* рейтинг */
.seg{display:flex;background:var(--card);border-radius:16px;padding:5px;margin:18px 0 10px}
.seg button{flex:1;height:44px;border-radius:12px;color:var(--muted);font-weight:800;font-size:16px}
.seg button.on{background:var(--orange);color:#14173d}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:20px}
.podium .p{flex:1;text-align:center}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;font-weight:800;font-size:22px;background:var(--lav);color:#14173d;border:4px solid #3b4282}
.podium .p.first .av{width:84px;height:84px;background:var(--orange);border-color:var(--yellow);font-size:28px}
.podium .p.me .av{background:var(--blue)}
.podium .stand{background:var(--card);border-radius:14px 14px 0 0;padding:10px 0;margin-top:8px}
.podium .stand b{display:block;font-size:24px}
.podium .stand small{color:var(--muted)}
.podium .p.first .stand{background:var(--orange);color:#14173d}
.podium .p.first .stand small{color:#14173d}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #262c66}
.list .it .n{width:22px;color:var(--muted)}
.list .it .av{width:44px;height:44px;font-size:15px;margin:0;background:var(--card2);color:#fff;border:0}
.list .it small{display:block;color:var(--muted);font-size:13px}
.list .it .s{margin-left:auto;font-weight:800;font-size:17px}
.mine{position:sticky;bottom:calc(var(--bottom) + 84px);display:flex;align-items:center;gap:12px;background:var(--orange);color:#14173d;border-radius:16px;padding:12px 14px;margin-top:12px}
.mine .av{width:44px;height:44px;font-size:15px;margin:0;background:#14173d;color:#fff;border:0}
.mine small{display:block;font-size:13px}
.mine .s{margin-left:auto;font-weight:800;font-size:17px}

/* профиль */
.skill{margin:14px 0}
.skill .row{justify-content:space-between;margin-bottom:8px;font-size:16px}
.skill .bar{height:12px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;text-align:center}
.badges .icon{margin:0 auto 6px}
.badges .lock{background:transparent;border:2px dashed #4a5196;color:var(--dim)}
.badges small{font-size:12px;line-height:1.2;display:block}
.modal{position:fixed;inset:0;background:rgba(8,10,32,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
.modal .sheet{background:var(--card);border-radius:22px;padding:22px 18px calc(var(--bottom) + 18px);width:100%;max-width:440px}
.modal p{margin:8px 0 18px}
.pick{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto;margin-top:10px;padding-right:2px}
.pick button{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:14px;padding:8px 12px;font-size:17px;font-weight:700;text-align:left}
.pick button small{margin-left:auto;color:var(--muted);font-size:14px}
.pick button .av{width:36px;height:36px;font-size:14px;margin:0;border:0;background:var(--card2);color:#fff}
.pick button.on{border-color:var(--orange);background:var(--card2)}
.pick button.on .av{background:var(--orange);color:#14173d}
.toast{position:fixed;left:50%;top:calc(var(--top) + 14px);transform:translateX(-50%);background:#fff;color:#14173d;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
if (inTg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#12153a'); tg.setBackgroundColor('#12153a'); tg.setBottomBarColor && tg.setBottomBarColor('#0d1030'); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = (kind) => {
  if (!inTg || !tg.HapticFeedback) return;
  try {
    if (kind === 'ok' || kind === 'error') tg.HapticFeedback.notificationOccurred(kind === 'ok' ? 'success' : 'error');
    else tg.HapticFeedback.impactOccurred('light');
  } catch (e) {}
};

/* ---------- данные команды (демо, пока нет сервера) ---------- */
// Команда: код для входа и состав берутся из team.json (имя, буква фамилии, номер).
let TEAM = { code: 'ЛЕГЕНДА-2016', title: 'Легенда 2016', coach: '', players: [] };
// Пока нет сервера, очки других игроков не видны — рейтинг показывает только свои.
const LIVE = false;
const SKILLS = {
  'Слежение': '#ec6a3f', 'Счёт': '#8fd3ff', 'Память': '#ffd23f', 'Реакция': '#c8c9ef', 'Знания': '#7be0a4', 'Теория': '#ffb38a'
};
const BADGES = [
  { id: 'first', name: 'Первая игра', color: '#8fd3ff', icon: 'star', why: 'Пройди первое задание' },
  { id: 'sniper', name: 'Снайпер', color: '#ffd23f', icon: 'target', why: '3 верных ответа подряд' },
  { id: 'perfect', name: 'Без ошибок', color: '#2fb35f', icon: 'check', why: 'Задание без единой ошибки' },
  { id: 'eye', name: 'Зоркий глаз', color: '#8fd3ff', icon: 'eye', why: '5 из 5 в «Шайбах в воротах»' },
  { id: 'fast', name: 'Молния', color: '#c8c9ef', icon: 'bolt', why: 'Верный ответ быстрее 3 секунд' },
  { id: 'scholar', name: 'Знаток', color: '#7be0a4', icon: 'book', why: 'Пройди 3 разных задания' },
  { id: 'week', name: 'Неделя без пропусков', color: '#ec6a3f', icon: 'flame', why: 'Серия 7 дней' },
  { id: 'captain', name: 'Капитан', color: '#ffd23f', icon: 'crown', why: '1 место за неделю' }
];

/* ---------- хранение: облако Telegram + память браузера ---------- */
const KEY = 'legenda_v1';
let S = null;
const blank = () => ({ name: '', team: '', points: 0, streak: 0, lastDay: null, plays: [], badges: [], answers: 0, correct: 0 });
function loadState() {
  return new Promise((resolve) => {
    let local = null;
    try { local = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
      tg.CloudStorage.getItem(KEY, (err, val) => {
        let cloud = null;
        try { cloud = val ? JSON.parse(val) : null; } catch (e) {}
        resolve(cloud || local || blank());
      });
    } else resolve(local || blank());
  });
}
function save() {
  // Храним только последние 60 игр, чтобы влезть в лимит облака Telegram (4 КБ).
  S.plays = S.plays.slice(-60);
  const json = JSON.stringify(S);
  try { localStorage.setItem(KEY, json); } catch (e) {}
  if (inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
    try { tg.CloudStorage.setItem(KEY, json); } catch (e) {}
  }
}

/* ---------- даты ---------- */
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const mondayKey = () => { const d = new Date(); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return dayKey(d); };
const daysToMonday = () => 7 - ((new Date().getDay() + 6) % 7);

/* ---------- задания ---------- */
let TASKS = [];
async function loadTasks() {
  if (window.EMBEDDED_TASKS) { TASKS = window.EMBEDDED_TASKS; TEAM = window.EMBEDDED_TEAM; return; }
  TEAM = await fetch('team.json', { cache: 'no-store' }).then(r => r.json());
  const idx = await fetch('tasks/index.json', { cache: 'no-store' }).then(r => r.json());
  TASKS = await Promise.all(idx.tasks.map(f => fetch('tasks/' + f, { cache: 'no-store' }).then(r => r.json())));
}
const taskById = (id) => TASKS.find(t => t.id === id);
// Каждое задание проходится один раз; следующее — первое непройденное по порядку из tasks/index.json.
const everPlayed = (id) => S.plays.some(p => p.id === id);
const nextTask = () => TASKS.find(t => !everPlayed(t.id));
const playOf = (id) => S.plays.find(p => p.id === id);
const taskSize = (t) => t.type === 'goals' ? t.rounds.length : t.type === 'quiz' ? t.questions.length : t.pairs.length;
const typeName = { goals: 'Игра на внимание', quiz: 'Викторина', match: 'Совмести пары' };

/* ---------- игрок ---------- */
const me = () => TEAM.players.find(p => p.id === S.player);
const initials = (n) => (n || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- иконки ---------- */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-5H9v5H4z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V11M10 20V6M14 20V9M18 20V13M4 20h16"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',

const app = document.getElementById('app');
let cleanup = null, backHandler = null;
function go(name, arg) {
  if (cleanup) { cleanup(); cleanup = null; }
  backHandler = null;
  window.scrollTo(0, 0);
  SCREENS[name](arg);
  if (inTg && tg.BackButton) backHandler ? tg.BackButton.show() : tg.BackButton.hide();
}
if (inTg && tg.BackButton) tg.BackButton.onClick(() => backHandler && backHandler());
function render(html, cls = '') { app.innerHTML = '<div class="screen ' + cls + '">' + html + '</div>'; return app.firstChild; }
const tabbar = (on) => '<nav class="tabbar">' +
  [['home', 'Главная', I.home], ['rating', 'Рейтинг', I.chart], ['profile', 'Профиль', I.user]]
    .map(([k, t, ic]) => '<button data-tab="' + k + '" class="' + (k === on ? 'on' : '') + '">' + ic + t + '</button>').join('') + '</nav>';
app.addEventListener('click', (e) => {

});
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}
function confirmExit(cb) {
  const text = 'Выйти из задания? Результат не сохранится.';
  if (inTg && tg.showConfirm) { tg.showConfirm(text, ok => ok && cb()); return; }
  const m = document.createElement('div'); m.className = 'modal';

  m.onclick = (e) => { const a = e.target.dataset.a; if (!a && e.target !== m) return; m.remove(); if (a === 'out') cb(); };

}

/* ---------- общий ход задания ---------- */
let RUN = null;
function startTask(id) {
  const t = taskById(id);
  if (everPlayed(id)) { const p = playOf(id); toast('Уже пройдено: ' + p.correct + ' из ' + p.total + ' верно'); return; }
  RUN = { task: t, i: 0, total: taskSize(t), correct: 0, inRow: 0, maxRow: 0, fast: false };
  if (t.type === 'goals') { RUN.order = t.rounds; go('goals'); }
  else if (t.type === 'quiz') { RUN.order = t.questions; go('quiz'); }
  else go('match');
}
const header = () => '<div class="progress"><button class="close" id="x">' + I.x + '</button><div class="segs">' +
  Array.from({ length: RUN.total }, (_, k) => '<i class="' + (k < RUN.i ? 'done' : k === RUN.i ? 'now' : '') + '"></i>').join('') +
  '</div><span class="count">' + Math.min(RUN.i + 1, RUN.total) + '/' + RUN.total + '</span></div>';
function wireExit(el) {
  const exit = () => confirmExit(() => go('home'));
  el.querySelector('#x').onclick = exit; backHandler = exit;
}
// Считаем верные ответы для итога и значков. Очки — только за пройденное задание (+1).
function scoreAnswer(ok, secs) {
  if (ok) {
    RUN.correct++; RUN.inRow++; RUN.maxRow = Math.max(RUN.maxRow, RUN.inRow);
    if (secs < 3) RUN.fast = true;
    haptic('ok');
  } else {
    RUN.inRow = 0; haptic('error');
  }
}
const linesHtml = (rows) => '<div class="lines">' + rows.map(r => '<div class="line"><b>' + r[0] + '</b><span class="' + r[2] + '">' + r[1] + '</span></div>').join('') + '</div>';

/* ---------- викторина ---------- */
SCREENS.quiz = () => {
  const q = RUN.order[RUN.i];
  const el = render(header() +
    '<div class="muted" style="font-size:14px">' + esc(RUN.task.title) + '</div>' +
    '<div class="q">' + esc(q.q) + '</div>' +
    '<div class="timer"><i id="tm"></i></div>' +
    '<div class="opts list">' + q.options.map((o, k) => '<button class="opt" data-k="' + (k + 1) + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<div id="after"></div>');
  wireExit(el);
  const t0 = performance.now(), tm = el.querySelector('#tm');
  tm.style.transition = 'width 10s linear'; requestAnimationFrame(() => requestAnimationFrame(() => tm.style.width = '0%'));
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const pick = +b.dataset.k, ok = pick === q.answer, secs = (performance.now() - t0) / 1000;
    tm.style.transition = 'none'; tm.style.width = getComputedStyle(tm).width;
    el.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add('ok'); });
    if (!ok) b.classList.add('bad');
    scoreAnswer(ok, secs);
    const last = RUN.i === RUN.total - 1;
    el.querySelector('#after').innerHTML =
      '<h2 style="margin:18px 0 0;color:' + (ok ? 'var(--green)' : '#fff') + '">' + (ok ? 'Верно!' : 'Почти!') + '</h2>' +
      (q.explain ? '<div class="explain">' + I.bulb + '<span>' + esc(q.explain) + '</span></div>' : '') +
      '<button class="btn" id="nx" style="margin-top:16px">' + (last ? 'Итоги' : 'Дальше') + ' ' + I.arrow + '</button>';
    el.querySelector('#nx').onclick = () => { RUN.i++; last ? finish() : go('quiz'); };
    el.querySelector('#nx').scrollIntoView({ behavior: 'smooth', block: 'end' });
  });
};

/* ---------- совмести пары ---------- */
SCREENS.match = () => {
  const t = RUN.task;
  const left = shuffle(t.pairs.map((p, k) => ({ k, s: p[0] })));
  const right = shuffle(t.pairs.map((p, k) => ({ k, s: p[1] })));
  RUN.i = 0;
  const el = render(header() +
    '<h1>' + esc(t.title) + '</h1><div class="muted" style="margin-top:6px;font-size:16px">' + esc(t.subtitle) + '. Нажми слева, потом справа.</div>' +
    '<div class="match"><div class="col"><small>' + esc(t.leftTitle || '') + '</small>' + left.map(x => '<button class="mbtn" data-side="l" data-k="' + x.k + '">' + esc(x.s) + '</button>').join('') +
    '</div><div class="col"><small>' + esc(t.rightTitle || '') + '</small>' + right.map(x => '<button class="mbtn" data-side="r" data-k="' + x.k + '">' + esc(x.s) + '</button>').join('') + '</div></div>' +
    '<div id="after"></div>');
  wireExit(el);
  const t0 = performance.now();
  let sel = null; const missed = new Set(); let matched = 0;
  const segs = el.querySelectorAll('.segs i'), count = el.querySelector('.count');
  el.querySelectorAll('.mbtn').forEach(b => b.onclick = () => {
    if (b.classList.contains('done')) return;
    if (b.dataset.side === 'l') {
      el.querySelectorAll('.mbtn[data-side=l]').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); sel = b; haptic(); return;
    }
    if (!sel) { toast('Сначала выбери слева'); return; }
    if (b.dataset.k === sel.dataset.k) {
      b.classList.add('done'); sel.classList.add('done'); sel.classList.remove('sel');
      matched++; haptic('ok');
      segs[matched - 1].className = 'done'; if (segs[matched]) segs[matched].className = 'now';
      count.textContent = Math.min(matched + 1, RUN.total) + '/' + RUN.total;
      sel = null;
      if (matched === t.pairs.length) done();
    } else {
      missed.add(sel.dataset.k); haptic('error');
      [b, sel].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 400); });
    }
  });
  function done() {
    const secs = (performance.now() - t0) / 1000;
    // Пара засчитывается, если её собрали с первой попытки.
    t.pairs.forEach((_, k) => scoreAnswer(!missed.has(String(k)), secs / t.pairs.length));
    const clean = t.pairs.length - missed.size;
    RUN.i = RUN.total;
    el.querySelector('#after').innerHTML =
      '<h2 style="margin:22px 0 10px;color:' + (missed.size ? '#fff' : 'var(--green)') + '">' + (missed.size ? 'Готово! Ошибок: ' + missed.size : 'Без единой ошибки!') + '</h2>' +
      linesHtml([['С первой попытки', clean + ' из ' + t.pairs.length, 'p']]) +
      '<button class="btn" id="nx" style="margin-top:16px">Итоги ' + I.arrow + '</button>';
    el.querySelector('#nx').onclick = finish;
    el.querySelector('#nx').scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
};

/* ---------- игра «Шайбы в воротах» ---------- */
const VW = 400, VH = 430, GOAL_L = 150, GOAL_R = 250, GOAL_Y = 62;
function makeRound(n, r) {
  const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
  const goals = ri(Math.ceil(n * 0.3), Math.floor(n * 0.6)), rest = n - goals;
  const posts = ri(1, Math.max(1, Math.floor(rest / 2)));
  const kinds = shuffle([].concat(Array(goals).fill('goal'), Array(posts).fill('post'), Array(rest - posts).fill('miss')));
  const speed = 290 + r * 45, gap = [1.05, 0.85, 0.7, 0.58, 0.48][Math.min(r, 4)];
  let t = 0.3;
  const shots = kinds.map(kind => {
    const s = { kind, t0: t, sx: rnd(40, 360), sy: rnd(330, 410) };
    if (kind === 'goal') { s.tx = rnd(GOAL_L + 14, GOAL_R - 14); s.ty = 36; }
    else if (kind === 'post') { s.side = Math.random() < 0.5 ? -1 : 1; s.tx = s.side < 0 ? GOAL_L : GOAL_R; s.ty = GOAL_Y; }
    else { s.tx = Math.random() < 0.5 ? rnd(40, GOAL_L - 18) : rnd(GOAL_R + 18, 360); s.ty = -20; }
    s.d = Math.hypot(s.tx - s.sx, s.ty - s.sy) / speed;
    t += gap * rnd(0.7, 1.3);
    return s;
  });
  const end = Math.max(...shots.map(s => s.t0 + s.d)) + 1.0;
  return { shots, goals, posts, misses: rest - posts, end };
}
function drawRink(ctx, lampOn) {
  ctx.fillStyle = '#eef3f8'; ctx.fillRect(0, 0, VW, VH);
  // линия ворот и зона вратаря
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, VW, GOAL_Y);
  ctx.beginPath(); ctx.moveTo(130, GOAL_Y); ctx.arc(200, GOAL_Y, 70, 0, Math.PI); ctx.closePath();
  ctx.fillStyle = '#c9dbf3'; ctx.fill(); ctx.strokeStyle = '#d4566d'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#d4283f'; ctx.fillRect(0, GOAL_Y - 2, VW, 4);
  // круги вбрасывания
  [[105, 300], [295, 300]].forEach(([x, y]) => {
    ctx.beginPath(); ctx.arc(x, y, 64, 0, Math.PI * 2); ctx.strokeStyle = '#e07085'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = '#e07085'; ctx.fill();
  });
  // сетка ворот
  ctx.fillStyle = '#2b2f55'; ctx.fillRect(GOAL_L, 22, GOAL_R - GOAL_L, GOAL_Y - 22);
  ctx.strokeStyle = '#9aa0c4'; ctx.lineWidth = 1;
  for (let x = GOAL_L + 8; x < GOAL_R; x += 9) { ctx.beginPath(); ctx.moveTo(x, 22); ctx.lineTo(x, GOAL_Y); ctx.stroke(); }
  for (let y = 28; y < GOAL_Y; y += 8) { ctx.beginPath(); ctx.moveTo(GOAL_L, y); ctx.lineTo(GOAL_R, y); ctx.stroke(); }
  ctx.fillStyle = '#e02a40'; ctx.fillRect(GOAL_L - 4, 18, 6, GOAL_Y - 16); ctx.fillRect(GOAL_R - 2, 18, 6, GOAL_Y - 16); ctx.fillRect(GOAL_L - 4, 18, GOAL_R - GOAL_L + 8, 5);
  // лампа гола
  ctx.beginPath(); ctx.arc(200, 10, 8, 0, Math.PI * 2);
  ctx.fillStyle = lampOn ? '#ff3b30' : '#7a7f9e'; ctx.fill();
  if (lampOn) { ctx.beginPath(); ctx.arc(200, 10, 18, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,59,48,.3)'; ctx.fill(); }
}
function drawPuck(ctx, x, y, a) {
  ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(x + 1.5, y + 3, 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(20,23,61,.18)'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fillStyle = '#111426'; ctx.fill();
  ctx.beginPath(); ctx.arc(x - 3, y - 3, 3, 0, Math.PI * 2); ctx.fillStyle = '#3a3f5c'; ctx.fill();
  ctx.globalAlpha = 1;
}
function puckAt(s, t) {
  const k = (t - s.t0) / s.d;
  if (k < 0) return null;
  if (k <= 1) return { x: s.sx + (s.tx - s.sx) * k, y: s.sy + (s.ty - s.sy) * k, a: 1 };
  const after = t - s.t0 - s.d;
  if (s.kind === 'goal') return after < 0.9 ? { x: s.tx, y: s.ty, a: after < 0.6 ? 1 : 1 - (after - 0.6) / 0.3 } : null;
  if (s.kind === 'post') return after < 0.55 ? { x: s.tx + s.side * after * 150, y: s.ty + after * 170, a: 1 - after / 0.55 } : null;
  return null;
}
SCREENS.goals = () => {
  const n = RUN.order[RUN.i], round = makeRound(n, RUN.i);
  RUN.round = round;
  const el = render(header() +
    '<div class="rink"><canvas id="cv"></canvas><span class="badge">Раунд ' + (RUN.i + 1) + ' · ' + n + ' ' + plural(n, 'бросок', 'броска', 'бросков') + '</span><div class="cd" id="cd">3</div></div>' +
    '<div class="q">Сколько было голов?</div><div class="muted" style="font-size:15px">Штанги и броски мимо не считаются</div>' +
    '<div class="timer"><i id="tm" style="width:100%"></i></div>' +
    '<div class="opts" id="opts"></div><div class="note" id="note">Смотри внимательно на ворота…</div>');
  wireExit(el);
  const cv = el.querySelector('#cv'), ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = VW * dpr; cv.height = VH * dpr; ctx.scale(dpr, dpr);
  const correct = round.goals;
  const lo = Math.max(0, correct - Math.floor(Math.random() * 4));
  const opts = [lo, lo + 1, lo + 2, lo + 3];
  el.querySelector('#opts').innerHTML = opts.map(v => '<button class="opt" disabled data-v="' + v + '">' + v + '</button>').join('');
  let raf, start = null, stopped = false, timers = [];
  const cd = el.querySelector('#cd');
  drawRink(ctx, false);
  [[600, '2'], [1200, '1'], [1800, null]].forEach(([ms, txt]) => timers.push(setTimeout(() => {
    if (txt) { cd.textContent = txt; haptic(); } else { cd.remove(); start = performance.now(); raf = requestAnimationFrame(frame); }
  }, ms)));
  function frame(now) {
    const t = (now - start) / 1000;
    let lamp = false;
    round.shots.forEach(s => { if (s.kind === 'goal' && t >= s.t0 + s.d && t < s.t0 + s.d + 0.7) lamp = true; });
    drawRink(ctx, lamp);
    round.shots.forEach(s => { const p = puckAt(s, t); if (p) drawPuck(ctx, p.x, p.y, Math.max(0, p.a)); });
    if (t < round.end) raf = requestAnimationFrame(frame);
    else stop();
  }
  function stop() {
    if (stopped) return; stopped = true;
    el.querySelector('.rink').insertAdjacentHTML('beforeend', '<span class="stop">Стоп!</span>');
    el.querySelector('#note').textContent = 'Ответь за 10 секунд, чтобы получить бонус за скорость';
    const tm = el.querySelector('#tm'); tm.style.transition = 'width 10s linear'; requestAnimationFrame(() => requestAnimationFrame(() => tm.style.width = '0%'));
    const t0 = performance.now(); haptic();
    el.querySelectorAll('.opt').forEach(b => {
      b.disabled = false;
      b.onclick = () => {
        el.querySelectorAll('.opt').forEach(x => x.disabled = true);
        b.classList.add('pick');
        const v = +b.dataset.v, secs = (performance.now() - t0) / 1000;
        scoreAnswer(v === correct, secs);
        setTimeout(() => go('roundResult', { ok: v === correct, v, secs }), 250);
      };
    });
  }
  cleanup = () => { cancelAnimationFrame(raf); timers.forEach(clearTimeout); };
};
SCREENS.roundResult = (r) => {
  const R = RUN.round, last = RUN.i === RUN.total - 1;
  const segs = '<div class="progress"><div class="segs">' + Array.from({ length: RUN.total }, (_, k) => '<i class="' + (k <= RUN.i ? 'done' : '') + '"></i>').join('') + '</div></div>';
  const confetti = r.ok ? Array.from({ length: 14 }, (_, k) => '<i class="confetti" style="left:' + (8 + Math.random() * 84) + '%;top:' + (60 + Math.random() * 200) + 'px;background:' + ['#ec6a3f', '#8fd3ff', '#ffd23f'][k % 3] + ';animation-delay:' + (Math.random() * .3) + 's"></i>').join('') : '';
  const el = render(segs + '<div class="result" style="position:relative">' + confetti +
    (r.ok
      ? '<div class="halo ok"><div>' + I.check.replace(/28/g, '84') + '</div></div><h1>Верно!</h1><p>Было ' + R.goals + ' ' + plural(R.goals, 'гол', 'гола', 'голов') + '. Ты ответил за ' + Math.max(1, Math.round(r.secs)) + ' ' + plural(Math.max(1, Math.round(r.secs)), 'секунду', 'секунды', 'секунд') + '.</p>'
      : '<div class="halo no"><div style="color:var(--blue)">' + I.target.replace(/28/g, '72') + '</div></div><h1>Почти!</h1><p>Было ' + R.goals + ' ' + plural(R.goals, 'гол', 'гола', 'голов') + ', а ты выбрал ' + r.v + '.<br>' + (r.v < R.goals ? 'Одна шайба проскочила незаметно.' : 'Штанга — это не гол.') + '</p>' +
        '<div class="explain" style="text-align:left;margin:0 0 12px">' + I.bulb + '<span>Подсказка: ' + esc(RUN.task.hint || '') + '</span></div>') +
    '<div class="recap" style="margin-top:12px"><small>РАЗБОР РАУНДА</small><div class="g"><div><b style="color:var(--orange)">' + R.goals + '</b>' + plural(R.goals, 'гол', 'гола', 'голов') + '</div><div><b>' + R.posts + '</b>' + plural(R.posts, 'штанга', 'штанги', 'штанг') + '</div><div><b>' + R.misses + '</b>мимо</div></div></div>' +
    '</div><div class="spacer"></div><button class="btn" id="nx">' + (last ? 'Итоги' : (r.ok ? 'Раунд ' : 'Дальше, раунд ') + (RUN.i + 2)) + ' ' + I.arrow + '</button>');
  backHandler = () => confirmExit(() => go('home'));
  el.querySelector('#nx').onclick = () => { RUN.i++; last ? finish() : go('goals'); };
};

/* ---------- итог задания ---------- */
function finish() {
  const t = RUN.task, today = dayKey();
  const pts = 1;
  if (S.lastDay !== today) S.streak = S.lastDay === yesterdayKey() ? S.streak + 1 : 1;
  S.lastDay = today;
  S.points += pts;
  S.answers += RUN.total; S.correct += RUN.correct;
  S.plays.push({ id: t.id, date: today, correct: RUN.correct, total: RUN.total, pts, skill: t.skill });
  const fresh = [];
  const give = (id, cond) => { if (cond && !S.badges.includes(id)) { S.badges.push(id); fresh.push(id); } };
  give('first', true);
  give('sniper', RUN.maxRow >= 3);
  give('perfect', RUN.correct === RUN.total);
  give('eye', t.type === 'goals' && RUN.correct === RUN.total);
  give('fast', RUN.fast);
  give('scholar', new Set(S.plays.map(p => p.id)).size >= 3);
  give('week', S.streak >= 7);
  give('captain', false); // появится вместе с общим рейтингом
  save();
  RUN.result = { pts, fresh };
  go('summary');
}
SCREENS.summary = () => {
  const r = RUN.result;
  const C = 2 * Math.PI * 80, part = RUN.correct / RUN.total;
  const el = render(
    '<div style="text-align:center;color:var(--muted);letter-spacing:.1em;font-size:13px;font-weight:800">' + 'ЗАДАНИЕ ПРОЙДЕНО' + '</div>' +
    '<h1 style="text-align:center;margin-top:8px;font-size:30px">' + (part >= 0.6 ? 'Отличная игра' : 'Хорошая попытка') + ', ' + esc(S.name) + '!</h1>' +
    '<div class="ring"><svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="#2c3372" stroke-width="18"/><circle cx="95" cy="95" r="80" fill="none" stroke="#ec6a3f" stroke-width="18" stroke-linecap="round" stroke-dasharray="' + (C * part) + ' ' + C + '"/></svg><div><b>' + RUN.correct + '/' + RUN.total + '</b><span class="muted">верно</span></div></div>' +
    '<div class="two"><div class="card"><small>Очки за задание</small><b style="color:var(--orange)">+' + r.pts + '</b></div><div class="card"><small>Всего очков</small><b>' + S.points + '</b></div></div>' +
    r.fresh.map(id => { const b = BADGES.find(x => x.id === id); return '<div class="newbadge" style="margin-top:12px"><div class="icon" style="background:' + b.color + '">' + I[b.icon] + '</div><div><small>НОВЫЙ ЗНАЧОК</small><div style="font-size:20px;font-weight:800">' + b.name + '</div><div class="muted" style="font-size:14px">' + b.why + '</div></div></div>'; }).join('') +
    '<div class="card row" style="margin-top:12px;color:var(--orange)">' + I.flame + '<span style="color:#fff;font-size:16px">Серия <b>' + S.streak + ' ' + plural(S.streak, 'день', 'дня', 'дней') + '</b>. Завтра новое задание.</span></div>' +
    '<div class="spacer"></div><div class="gap"><button class="btn" data-tab="rating">Смотреть рейтинг</button><button class="btn dark" data-tab="home">На главную</button></div>');
  if (RUN.correct > 0) haptic('ok');
};

/* ---------- запуск ---------- */
(async () => {
  try {
    [S] = await Promise.all([loadState(), loadTasks()]);
  } catch (e) {
    app.innerHTML = '<div class="screen"><h2>Не удалось загрузить задания</h2><p class="muted">Проверь интернет и открой приложение заново.</p></div>';
    return;
  }
  S = Object.assign(blank(), S);
  go(S.player && S.team && TEAM.players.some(p => p.id === S.player) ? 'home' : 'login');
})();
</script>
